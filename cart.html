<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — FINDLY</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <h1>Your cart</h1>
    <p id="cartSub">Loading…</p>
  </div>

  <div class="cart-layout" id="cartLayout" hidden>
    <div class="cart-list" id="cartList"></div>

    <aside class="summary">
      <h2>Order summary</h2>

      <div class="field" style="margin-bottom:14px">
        <label for="zoneSel">Ship to</label>
        <select id="zoneSel"></select>
      </div>

      <div class="free-ship" id="freeShipBox"></div>

      <div class="kv"><span>Subtotal</span><b id="sumSub">$0.00</b></div>
      <div class="kv"><span>Shipping</span><b id="sumShip">$0.00</b></div>
      <div class="kv total"><span>Total</span><b id="sumTotal">$0.00</b></div>

      <button class="ship-toggle" id="shipToggle" type="button">
        <span>How shipping was calculated</span><span id="shipToggleArrow">+</span>
      </button>
      <div class="ship-detail" id="shipDetail" hidden></div>

      <a class="btn btn-primary btn-block" id="goCheckout" href="checkout.html" style="margin-top:18px">Checkout</a>
      <a class="btn btn-ghost btn-block" href="index.html" style="margin-top:10px">Keep browsing</a>

      <p class="ship-note">Ships in 1 business day. 30-day returns.<br>Card details never touch this site.</p>
    </aside>
  </div>

  <div id="cartEmpty" hidden></div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/shipping.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  mountChrome();

  /* 分区下拉 */
  var zoneSel = document.getElementById('zoneSel');
  zoneSel.innerHTML = window.CONFIG.shipping.zones.map(function (z) {
    return '<option value="' + z.id + '">' + escapeHTML(z.label) + '</option>';
  }).join('');
  zoneSel.value = window.cart.zone();
  zoneSel.onchange = function () { window.cart.setZone(zoneSel.value); };

  document.getElementById('shipToggle').onclick = function () {
    var d = document.getElementById('shipDetail');
    d.hidden = !d.hidden;
    document.getElementById('shipToggleArrow').textContent = d.hidden ? '+' : '−';
  };

  render();
  document.addEventListener('cart:change', render);

  function render() {
    var rows = window.cart.detailed();
    var empty = document.getElementById('cartEmpty');
    var layout = document.getElementById('cartLayout');
    var sub = document.getElementById('cartSub');
    var n = window.cart.count();

    if (!rows.length) {
      layout.hidden = true;
      empty.hidden = false;
      sub.textContent = 'Nothing here yet.';
      empty.innerHTML =
        '<div class="empty" style="margin:20px 0 60px">' +
          '<h2>Your cart is empty</h2>' +
          '<p>The shelf is small on purpose, so have a look before this week\u2019s picks sell through.</p>' +
          '<a class="btn btn-primary" href="index.html">Back to the shelf</a>' +
        '</div>';
      return;
    }

    empty.hidden = true;
    layout.hidden = false;
    sub.textContent = n + (n === 1 ? ' item' : ' items') + ' in ' + rows.length +
      (rows.length === 1 ? ' line' : ' lines') + ' — ready to go.';

    /* ---- 购物车行 ---- */
    document.getElementById('cartList').innerHTML = rows.map(function (r) {
      var p = r.product, v = r.variant;
      var variantLine = v.shortLabel
        ? '<span class="cart-variant">' + escapeHTML(v.shortLabel) + '</span>'
        : '';
      return '<div class="cart-row">' +
        '<div class="cart-thumb" style="' + thumbStyle(p) + '">' + thumbSVG(p) + '</div>' +
        '<div class="cart-info">' +
          '<h3>' + escapeHTML(p.title) + '</h3>' +
          '<p class="cn">' + variantLine +
            '<span class="cart-sku">' + escapeHTML(v.sku) + '</span>' +
            '<span class="cart-unit">' + money(v.price) + ' each</span></p>' +
          '<p class="cn">' + window.fmtG(v.weight) + ' · ' +
            v.dims.l + '×' + v.dims.w + '×' + v.dims.h + ' cm</p>' +
          '<div class="qty-sm">' +
            '<button type="button" data-dec="' + escapeHTML(r.key) + '" aria-label="Decrease">&#8722;</button>' +
            '<span>' + r.qty + '</span>' +
            '<button type="button" data-inc="' + escapeHTML(r.key) + '" aria-label="Increase">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="cart-row-right">' +
          '<span class="cart-line-price">' + money(r.line) + '</span>' +
          '<button class="link-remove" type="button" data-del="' + escapeHTML(r.key) + '">Remove</button>' +
        '</div>' +
      '</div>';
    }).join('');

    /* ---- 运费与合计 ---- */
    var q = window.cart.quote();
    var subtotal = window.cart.subtotal();

    document.getElementById('sumSub').textContent = money(subtotal);
    document.getElementById('sumShip').textContent = q.shipping === 0 ? 'Free' : money(q.shipping);
    document.getElementById('sumTotal').textContent = money(subtotal + q.shipping);

    /* 免运提示 */
    var box = document.getElementById('freeShipBox');
    if (q.freeApplied) {
      box.innerHTML = '<p><b>Free shipping unlocked.</b></p>' +
        '<div class="track"><i class="done" style="width:100%"></i></div>';
    } else if (q.overFreeCap) {
      box.innerHTML = '<p>Ships free up to ' + window.fmtG(q.freeMaxBillableG) +
        '. This order is <b>' + window.fmtG(q.billableWeightG) +
        '</b> billable, so standard rates apply.</p>' +
        '<div class="track"><i class="over" style="width:100%"></i></div>';
    } else {
      box.innerHTML = '<p>You are <b>' + money(q.remainingForFree) +
        '</b> away from free shipping.</p>' +
        '<div class="track"><i style="width:' +
        Math.min(100, Math.round(subtotal / q.freeThreshold * 100)) + '%"></i></div>';
    }

    /* 运费明细 */
    document.getElementById('shipDetail').innerHTML =
      '<div class="kv"><span>Destination</span><b>' + escapeHTML(q.zone.label) + '</b></div>' +
      '<div class="kv"><span>Units</span><b>' + n + '</b></div>' +
      '<div class="kv"><span>Actual weight</span><b>' + window.fmtG(q.packedWeightG) + '</b></div>' +
      '<div class="kv"><span>Volume weight</span><b>' + window.fmtG(q.volumetricWeightG) + '</b></div>' +
      '<div class="kv"><span>Billable weight</span><b>' + window.fmtG(q.billableWeightG) + '</b></div>' +
      (q.volumetricDominates
        ? '<p class="ship-flag">Billed on volume — this order takes up more space than it weighs. ' +
          'Volume weight is ' + q.volumetricShare + '% of the billable weight.</p>'
        : '<p class="ship-flag ship-flag-ok">Billed on actual weight — this order is dense enough that size does not matter.</p>') +
      (q.oversize
        ? '<p class="ship-flag">Oversize surcharge applied: +' + money(q.oversizeSurcharge) + '</p>' : '') +
      '<div class="kv"><span>Base rate</span><b>' + money(q.baseRate) + '</b></div>' +
      (q.oversize ? '<div class="kv"><span>Oversize surcharge</span><b>' + money(q.oversizeSurcharge) + '</b></div>' : '') +
      '<div class="kv"><span>Free shipping discount</span><b>' +
        (q.freeApplied ? '−' + money(q.baseRate + q.oversizeSurcharge) : '—') + '</b></div>' +
      '<div class="kv" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px">' +
        '<span><b style="color:var(--ink)">Shipping charged</b></span><b>' +
        (q.shipping === 0 ? 'Free' : money(q.shipping)) + '</b></div>' +
      '<p class="ship-note" style="margin-top:10px">Volume divisor: 1 kg per ' +
        window.CONFIG.shipping.volumetricDivisor.toLocaleString() + ' cm³. ' +
        'Packing overhead included: ' + window.CONFIG.shipping.packing.weightG + ' g + ' +
        Math.round((window.CONFIG.shipping.packing.volumeFactor - 1) * 100) + '% volume.</p>';
  }

  /* 事件委托 */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-inc],[data-dec],[data-del]');
    if (!t) return;
    var key = t.getAttribute('data-inc') || t.getAttribute('data-dec') || t.getAttribute('data-del');
    var row = window.cart.detailed().find(function (r) { return r.key === key; });
    if (!row) return;
    if (t.hasAttribute('data-inc')) window.cart.setQty(key, row.qty + 1);
    if (t.hasAttribute('data-dec')) window.cart.setQty(key, row.qty - 1);
    if (t.hasAttribute('data-del')) { window.cart.remove(key); toast('Removed from cart'); }
  });
})();
</script>
</body>
</html>
